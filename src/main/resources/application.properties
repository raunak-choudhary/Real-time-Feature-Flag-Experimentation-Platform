spring.application.name=REX-Platform
server.port=${SERVER_PORT:8080}

# Datasource. Values come from the environment; spring-dotenv loads .env for local runs.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Flyway owns the schema. Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Cross-origin access for the dashboard, which is deployed on a different origin.
rex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Rollout sweep interval. Kept short in tests so a staged advance can be observed.
rex.rollout.sweep-interval-ms=${REX_ROLLOUT_SWEEP_INTERVAL_MS:30000}
