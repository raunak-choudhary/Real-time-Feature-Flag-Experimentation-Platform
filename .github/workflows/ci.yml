name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"

jobs:
  # Fast checks run first and independently, so a formatting slip reports as a formatting
  # failure rather than hiding inside a generic build failure.
  format:
    name: Format (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Check Java formatting
        run: ./mvnw -B --no-transfer-progress spotless:check

  lint-java:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Check Java style
        run: ./mvnw -B --no-transfer-progress checkstyle:check

  static-analysis:
    name: Static analysis (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Find bugs
        run: ./mvnw -B --no-transfer-progress -DskipTests compile spotbugs:check

  architecture:
    name: Architecture (ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Check layering rules
        run: ./mvnw -B --no-transfer-progress test -Dtest=LayeringRulesTest -DfailIfNoSpecifiedTests=false

  migrations:
    name: Migrations (Flyway vs entities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Runs with ddl-auto=validate, so a migration that has drifted from an entity fails here
      # rather than at deployment time.
      - name: Validate schema against entities
        run: ./mvnw -B --no-transfer-progress test -Dtest=RexPlatformApplicationTests -DfailIfNoSpecifiedTests=false

  test-backend:
    name: Tests and coverage (JUnit, JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # clean is deliberate: without it jacoco.exec can accumulate across runs and report a
      # coverage figure several points higher than reality.
      - name: Run suite and enforce coverage floor
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  rollout:
    name: Rollout automation and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Staged advancement, guardrail rollback and the audit trail are the flagship behaviour, so
      # a regression in them fails by name rather than inside a general test failure.
      - name: Verify staged rollout, guardrails and audit
        run: ./mvnw -B --no-transfer-progress test -Dtest='com.rex.rollout.*Test,com.rex.audit.*Test' -DfailIfNoSpecifiedTests=false

  statistics:
    name: Statistics (verified against worked examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # These assert against published normal tables and hand derived worked examples rather than
      # against the implementation, so a silent regression in the arithmetic fails here by name.
      - name: Verify significance, intervals and the peeking guard
        run: ./mvnw -B --no-transfer-progress test -Dtest='com.rex.statistics.*Test' -DfailIfNoSpecifiedTests=false

  realtime:
    name: Real-time (WebSocket end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # The toggle to client path crosses the service layer, the event bus, the transaction
      # boundary, the broker and the socket. Unit tests cannot prove it, so it gets its own check.
      - name: Verify push propagation
        run: ./mvnw -B --no-transfer-progress test -Dtest=WebSocketIntegrationTest -DfailIfNoSpecifiedTests=false

  sdk-build:
    name: SDK builds and typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The dashboard imports the SDK by package name, so a broken SDK build breaks the dashboard.
      - name: Typecheck the SDK in isolation
        run: npx tsc --noEmit -p tsconfig.json

  performance:
    name: Propagation latency (non blocking)
    runs-on: ubuntu-latest
    # Timing on a shared runner is noisy. This reports a number without gating the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Measure toggle to client latency
        run: ./mvnw -B --no-transfer-progress test -Pperformance

  docker:
    name: Container image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t rex-platform:ci .
      # Building is not the same as starting. A missing base architecture, a bad entrypoint or a
      # broken healthcheck all pass a build and fail on first run.
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres --network host \
            -e POSTGRES_DB=rexdb -e POSTGRES_USER=rex_user -e POSTGRES_PASSWORD=ci_password \
            postgres:16-alpine
      - name: Start the app and wait for health
        run: |
          docker run -d --name ci-app --network host \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/rexdb \
            -e DB_USER=rex_user -e DB_PASSWORD=ci_password \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            rex-platform:ci
          for i in $(seq 1 40); do
            sleep 3
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after ~$((i * 3))s"; exit 0
            fi
          done
          echo "never became healthy"; docker logs ci-app; exit 1

  service-layer:
    name: Service layer (inherited code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # These three services were inherited untested and hold the flag lifecycle, the experiment
      # lifecycle and every aggregation the dashboard reads. Failing by name says which one broke.
      - name: Verify the flag, experiment and metrics services
        run: ./mvnw -B --no-transfer-progress test -Dtest='com.rex.service.*Test' -DfailIfNoSpecifiedTests=false

  broadcast-contract:
    name: Broadcast contract (no silent flag change)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # A mutator that saves without announcing still passes any test that reads the flag back, so
      # the gap only shows up as a stale client. This job exists to make that failure loud.
      - name: Verify every flag change is announced
        run: ./mvnw -B --no-transfer-progress test -Dtest='com.rex.service.FlagChangeBroadcastTest' -DfailIfNoSpecifiedTests=false

  api-contract:
    name: API contract (status codes and errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # Status codes are the part of an API that breaks without any test failing, because a
      # catch-all handler answers every failure with a well formed body and a 500.
      - name: Verify endpoint behaviour and error responses
        run: ./mvnw -B --no-transfer-progress test -Dtest='com.rex.api.*Test' -DfailIfNoSpecifiedTests=false

  portable-sql:
    name: Portable SQL (no vendor only functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Queries written against H2 shipped to a Postgres deployment and threw there. Nothing caught
      # it, because the name of a missing function is only rejected when the query actually runs.
      - name: Reject H2 only functions in repository queries
        run: |
          if grep -rniE 'formatdatetime\(|parsedatetime\(|dateadd\(|datediff\(' src/main/java/com/rex/repository/ src/main/resources/db/; then
            echo "::error::vendor specific SQL function found; use a portable equivalent"
            exit 1
          fi
          echo "no vendor only SQL functions found"

  dashboard-build:
    name: Dashboard builds (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Typecheck and lint both pass on source that Next still refuses to build, so the production
      # build is its own check rather than something discovered at deploy time.
      - name: Build the dashboard
        run: npm run build --workspace @rex/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080

  typecheck-frontend:
    name: Typecheck (tsc strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint-frontend:
    name: Lint (ESLint type-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-frontend:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -- --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14
